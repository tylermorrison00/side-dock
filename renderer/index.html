<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Side Dock</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  :root {
    --bg: #1a1210; --panel: #241a15; --panel2: #2e211a; --line: #3a2a22;
    --text: #f5e9dc; --muted: #a89888; --green: #2fe07a; --cyan: #ff7a1a;
    --accent: #ff7a1a;
  }
  body.light {
    --bg: #f3e6d3; --panel: #fbf3e4; --panel2: #efe0c8; --line: #e0cdb0;
    --text: #1f1a17; --muted: #8a7a6a; --green: #2fe07a; --cyan: #ff7a1a;
    --accent: #ff7a1a;
  }
  body.light .dock { border-color: #e0cdb0; box-shadow: 0 20px 50px rgba(120,90,50,.25), 0 0 0 1px rgba(255,255,255,.50); }
  body.light .logo { background: var(--bg); }
  body.light .tool .icon { background: #fbf3e4; }
  body.light .btn.primary { background: #ff7a1a; border-color: #ff7a1a; color: #ffffff; }
  /* Glassmorphism theme: Blur 20, Refraction 0.05, Depth 15, from hype4 generator screenshot */
  body.glass {
    --bg: rgba(255, 255, 255, 0.05); --panel: rgba(255, 255, 255, 0.08); --panel2: rgba(255, 255, 255, 0.12); --line: rgba(255, 255, 255, 0.18);
    --text: #ffffff; --muted: rgba(255, 255, 255, 0.70); --green: #2fe07a; --cyan: #ff7a1a;
    --accent: #ff7a1a;
  }
  body.glass .dock { background: rgba(255, 255, 255, 0.05); backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px); border-radius: 20px; border: 1px solid rgba(255, 255, 255, 0.3); box-shadow: inset 2px -2px 1px -1px rgba(255, 255, 255, 0.9), inset -2px 2px 1px -1px rgba(255, 255, 255, 0.9), inset 6px -6px 1px -6px rgba(255, 255, 255, 0.55), inset -6px 6px 1px -6px rgba(255, 255, 255, 0.55), inset 0 0 2px rgba(0, 0, 0, 0.8), 0 8px 32px rgba(0, 0, 0, 0.1); position: relative; overflow: hidden; }
  body.glass .dock::before { content: ''; position: absolute; top: 0; left: 0; right: 0; height: 1px; background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.8), transparent); }
  body.glass .dock::after { content: ''; position: absolute; top: 0; left: 0; width: 1px; height: 100%; background: linear-gradient(180deg, rgba(255, 255, 255, 0.8), transparent, rgba(255, 255, 255, 0.3)); }
  body.glass.collapsed .dock { box-shadow: 0 10px 20px rgba(0,0,0,0.30); background: rgba(255, 255, 255, 0.05); border-radius: 18px; }
  body.glass .logo { background: rgba(255, 255, 255, 0.05); backdrop-filter: blur(20px); }
  body.glass .tool .icon { background: rgba(255, 255, 255, 0.08); }
  body.glass .btn.primary { background: #ff7a1a; border-color: #ff7a1a; color: #ffffff; }
  html, body { height: 100%; }
  body {
    background: transparent; color: var(--text);
    font-family: Inter, Segoe UI, system-ui, sans-serif;
    overflow: hidden; user-select: none;
    display: flex; justify-content: flex-end;
  }
  .dock {
    height: 100%; width: 100%; padding: 14px 10px; display: flex; flex-direction: column; gap: 14px;
    background: var(--bg); border: 1px solid var(--line); border-radius: 24px 24px 24px 24px;
    box-shadow: 0 20px 50px rgba(0,0,0,.60);
    transition: width .30s ease, transform .30s ease, opacity .30s ease;
  }
  body.hidden .dock { transform: translateX(120%); opacity: 0; pointer-events: none; }
  body.collapsed .dock { width: 56px; padding: 14px 8px; align-items: center; border-radius: 18px 18px 18px 18px; }
  .topbar { display: flex; align-items: center; justify-content: space-between; -webkit-app-region: drag; }
  .brand { display: flex; align-items: center; gap: 10px; min-width: 0; flex-shrink: 1; }
  .logo {
    width: 30px; height: 30px; flex: 0 0 30px; border-radius: 9px; overflow: hidden;
    background: var(--bg); border: 1px solid var(--line);
    display: grid; place-items: center; font-size: 16px; color: var(--cyan); padding: 0;
  }
  .logo img { width: 100%; height: 100%; object-fit: cover; display: block; border-radius: 9px; }
  .brand-name { font-weight: 800; font-size: 18px; white-space: nowrap; line-height: 30px; }
  .brand-sub { font-size: 11px; color: var(--muted); white-space: nowrap; }
  .top-actions { display: flex; gap: 6px; -webkit-app-region: no-drag; flex-shrink: 0; }
  .winbtns { display: flex; gap: 6px; }
  .winbtns button, .settings-btn {
    width: 30px; height: 30px; border-radius: 9px; border: 1px solid var(--line);
    background: var(--panel); color: var(--muted); cursor: pointer; font-size: 14px;
  }
  .winbtns button:hover, .settings-btn:hover { color: var(--text); }
  .tool-list { flex: 1; display: flex; flex-direction: column; gap: 8px; overflow-y: auto; padding: 2px; }
  .tool {
    display: flex; align-items: center; gap: 12px; width: 100%; text-align: left;
    background: transparent; border: 1px solid transparent; border-radius: 14px;
    color: var(--text); padding: 9px 10px; cursor: pointer; position: relative;
  }
  .tool:hover { background: var(--panel2); border-color: var(--line); }
  .tool .icon {
    width: 44px; height: 44px; flex: 0 0 44px; border-radius: 13px; display: grid; place-items: center;
    background: var(--panel2); border: 1px solid var(--line); font-size: 20px;
  }
  .tool .name { font-size: 14px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; flex: 1; }
  .tool .del { display: none; border: 0; background: transparent; color: var(--muted); cursor: pointer; font-size: 16px; }
  .tool:hover .del { display: block; }
  .footer { display: flex; flex-direction: column; gap: 8px; width: 100%; }
  .btn {
    display: flex; align-items: center; gap: 10px; width: 100%; min-height: 32px; padding: 6px 12px;
    border-radius: 10px; border: 1px solid var(--line); background: var(--panel);
    color: var(--text); cursor: pointer; font-size: 13px; font-weight: 600;
  }
  .btn.primary { background: #ff7a1a; border-color: #ff7a1a; color: #ffffff; }
  .btn span.ic { font-size: 17px; flex: 0 0 auto; display: grid; place-items: center; }
  .btn span.ic svg { display: block; }
  .form { display: none; background: var(--panel); border: 1px solid var(--line); border-radius: 16px; padding: 12px; gap: 8px; flex-direction: column; }
  .form.open { display: flex; }
  .form input, .form select {
    width: 100%; padding: 10px; border-radius: 10px; border: 1px solid var(--line);
    background: var(--panel2); color: var(--text); outline: none; font-size: 13px;
  }
  .form label { font-size: 11px; color: var(--muted); }
  .update-status { font-size: 12px; color: var(--muted); line-height: 1.5; padding: 0 4px; min-height: 18px; }
  .settings-row { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
  .settings-row label { font-size: 13px; color: var(--text); }
  .toggle { min-width: 52px; padding: 8px 10px; border-radius: 999px; border: 1px solid var(--line); background: var(--panel2); color: var(--text); cursor: pointer; font-size: 12px; font-weight: 700; }
  /* Collapsed: icons only, but every button stays visible as an icon. */
  body.collapsed .brand-name, body.collapsed .brand-sub,
  body.collapsed .tool .name, body.collapsed .tool .del, body.collapsed .collapse-label,
  body.collapsed .winbtns, body.collapsed .add-label { display: none !important; }
  body.collapsed .topbar { flex-direction: column; gap: 10px; width: 32px; justify-content: flex-start; align-items: center; }
  body.collapsed .brand { width: 32px; justify-content: center; gap: 0; }
  body.collapsed .brand > div:not(.logo) { display: none; }
  body.collapsed .top-actions { width: 32px; justify-content: center; }
  body.collapsed .tool-list { width: 32px; flex: 1; align-items: center; gap: 12px; }
  body.collapsed .tool { width: 32px; height: 32px; padding: 0; justify-content: center; position: relative; }
  body.collapsed .tool .icon { width: 32px; height: 32px; flex: 0 0 32px; border-radius: 10px; font-size: 16px; }
  body.collapsed .logo { width: 32px; height: 32px; flex: 0 0 32px; border-radius: 10px; font-size: 16px; }
  body.collapsed .btn { position: relative; width: 32px; height: 32px; min-height: 32px; padding: 0; justify-content: center; border-radius: 10px; }
  body.collapsed .btn span.ic { font-size: 16px; }
  body.collapsed .settings-btn { position: relative; width: 32px; height: 32px; border-radius: 10px; font-size: 15px; }
  body.collapsed .tool:hover::after,
  body.collapsed .btn:hover::after,
  body.collapsed .settings-btn:hover::after {
    content: attr(data-tip); position: absolute; right: calc(100% + 10px); top: 50%; transform: translateY(-50%); z-index: 50;
    background: #2e211a; border: 1px solid var(--line); color: var(--text);
    padding: 8px 12px; border-radius: 11px; font-size: 13px; white-space: nowrap;
    box-shadow: 0 10px 30px rgba(0,0,0,.45);
  }
  body.collapsed .tool:hover::after { content: attr(data-name); }
  body.collapsed .footer { width: 32px; gap: 12px; align-items: center; justify-content: center; margin-left: auto; margin-right: auto; }
  body.collapsed .form { display: none !important; }
  #arrowTab { display: none; width: 24px; height: 64px; background: var(--bg); border: 1px solid var(--line); border-right: 0; border-radius: 12px 0 0 12px; color: var(--accent); font-size: 16px; font-weight: 800; align-items: center; justify-content: center; cursor: pointer; position: absolute; left: 0; top: 50%; transform: translateY(-50%); }
  body.hidden { display: grid; place-items: center; }
  body.hidden #arrowTab { position: static; transform: none; }
  body.arrow-only .dock { display: none !important; }
  body.arrow-only #arrowTab { position: static; transform: none; }
  body.hidden #arrowTab { display: grid; }
  body.glass #arrowTab { background: linear-gradient(135deg, rgba(255,255,255,0.18), rgba(40,42,48,0.55)); backdrop-filter: blur(20px); border: 1px solid rgba(255, 255, 255, 0.18); }
  /* Auto-hide: hidden hone par dock chhupa rehta hai, arrow alag chhoti window me dikhta hai,
     taake main window click-through ho aur peeche wali window ke button block na hon. */
  /* body.hidden dock slide handled above */
</style>
</head>
<body>
<div id="arrowTab">◀</div>
<div class="dock">
  <div class="topbar">
    <div class="brand">
      <div class="logo"><img id="logoImg" src="../assets/icon-orange-dark.png" alt="Side Dock" onerror="this.src='../assets/icon-orange-transparent.png'; this.onerror=function(){this.src='../assets/icon.png'; this.onerror=function(){this.style.display='none'; this.parentElement.textContent='⚡';};};"></div>
      <div class="brand-name">Side Dock</div>
    </div>
    <div class="top-actions">
      <button class="settings-btn" id="settingsBtn" title="Settings" data-tip="Settings">⚙</button>
    </div>
  </div>

  <div class="form" id="settingsPanel">
    <button class="btn primary" id="updateBtn"><span class="ic">⟳</span><span>Update</span></button>
    <div class="update-status" id="updateStatus"></div>
    <div class="settings-row">
      <label>Auto-start</label>
      <button class="toggle" id="autoBtn">On</button>
    </div>
    <div class="settings-row">
      <label>Theme</label>
      <button class="toggle" id="themeBtn">Dark</button>
    </div>
    <div class="settings-row">
      <label>Auto-hide</label>
      <button class="toggle" id="autohideBtn">Off</button>
    </div>
  </div>

  <div class="tool-list" id="toolList"></div>

  <div class="form" id="addForm">
    <label>Tool name</label><input id="fName" placeholder="e.g. Notion">
    <label>Icon (emoji or letter)</label><input id="fIcon" placeholder="e.g. 📝" maxlength="4">
    <label>Type</label>
    <select id="fKind"><option value="url">Website / link</option><option value="app">Laptop app / command</option></select>
    <label>Link or app path / command</label><input id="fTarget" placeholder="https://... or C:\... or app name">
    <button class="btn primary" id="saveTool"><span class="ic">✓</span><span>Save tool</span></button>
  </div>

  <div class="footer">
    <button class="btn" id="collapseBtn" data-tip="Expand Sidebar"><span class="ic" id="collapseIc"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#ff7a1a" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect width="18" height="18" x="3" y="3" rx="2"/><path d="M9 3v18"/><path d="m16 15-3-3 3-3"/></svg></span><span class="collapse-label">Collapse Sidebar</span></button>
  </div>
</div>

<script>
  let mode = 'expanded';
  let autoStart = true;
  let theme = 'dark';
  let autoHide = false;
  let tools = [];
  function applyTheme() {
    document.body.classList.toggle('light', theme === 'light');
    document.body.classList.toggle('glass', theme === 'glass');
    const tb = document.getElementById('themeBtn');
    if (tb) tb.textContent = theme === 'light' ? 'Light' : (theme === 'glass' ? 'Glass' : 'Dark');
    const li = document.getElementById('logoImg');
    if (li) li.src = theme === 'light' ? '../assets/icon-orange-light.png' : (theme === 'glass' ? '../assets/icon-orange-transparent.png' : '../assets/icon-orange-dark.png');
  }
  const list = document.getElementById('toolList');

  function render() {
    document.body.classList.toggle('collapsed', mode === 'collapsed');
    document.getElementById('collapseIc').innerHTML = mode === 'collapsed'
      ? '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#ff7a1a" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect width="18" height="18" x="3" y="3" rx="2"/><path d="M9 3v18"/><path d="m8 15 3-3-3-3"/></svg>'
      : '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#ff7a1a" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect width="18" height="18" x="3" y="3" rx="2"/><path d="M9 3v18"/><path d="m16 15-3-3 3-3"/></svg>';
    document.querySelector('#collapseBtn .collapse-label').textContent = mode === 'collapsed' ? 'Expand Sidebar' : 'Collapse Sidebar';
    document.getElementById('collapseBtn').dataset.tip = mode === 'collapsed' ? 'Expand Sidebar' : 'Collapse Sidebar';
    list.querySelectorAll('.tool').forEach(el => el.remove());
    tools.forEach(tool => {
      const b = document.createElement('button');
      b.className = 'tool'; b.dataset.name = tool.name;
      b.innerHTML = `<span class="icon">${tool.icon || '◆'}</span><span class="name">${tool.name}</span><span class="del" title="Remove">✕</span>`;
      b.addEventListener('click', (e) => {
        if (e.target.classList.contains('del')) return;
        window.sideDock.launchTool(tool);
      });
      b.querySelector('.del').addEventListener('click', async () => {
        tools = await window.sideDock.removeTool(tool.id); render();
      });
      list.appendChild(b);
    });
  }

  async function ensureExpanded() {
    if (mode === 'collapsed') {
      mode = await window.sideDock.setMode('expanded');
      render();
    }
  }

  document.getElementById('autoBtn').addEventListener('click', async () => {
    autoStart = await window.sideDock.setAutostart(!autoStart);
    document.getElementById('autoBtn').textContent = autoStart ? 'On' : 'Off';
  });
  document.getElementById('arrowTab').addEventListener('mouseenter', () => { cancelHide(); setHiddenState(false); });
  document.getElementById('arrowTab').addEventListener('click', () => { cancelHide(); setHiddenState(false); });
  document.getElementById('autohideBtn').addEventListener('click', async () => {
    autoHide = await window.sideDock.setAutohide(!autoHide);
    document.getElementById('arrowTab').addEventListener('mouseenter', () => { cancelHide(); setHiddenState(false); });
  document.getElementById('arrowTab').addEventListener('click', () => { cancelHide(); setHiddenState(false); });
  document.getElementById('autohideBtn').textContent = autoHide ? 'On' : 'Off';
  });
  document.getElementById('themeBtn').addEventListener('click', async () => {
    theme = await window.sideDock.setTheme(theme === 'dark' ? 'light' : (theme === 'light' ? 'glass' : 'dark'));
    applyTheme();
  });
  document.getElementById('settingsBtn').addEventListener('click', async () => {
    await ensureExpanded();
    document.getElementById('settingsPanel').classList.toggle('open');
    document.getElementById('updateStatus').textContent = '';
  });
  document.getElementById('updateBtn').addEventListener('click', async () => {
    const status = document.getElementById('updateStatus');
    status.textContent = 'Checking for update, please wait...';
    const result = await window.sideDock.doUpdate();
    status.textContent = result.message || '';
  });
  document.getElementById('collapseBtn').addEventListener('click', async () => {
    mode = await window.sideDock.setMode(mode === 'collapsed' ? 'expanded' : 'collapsed');
    render();
  });
  if (document.getElementById('addBtn')) document.getElementById('addBtn').addEventListener('click', async () => {
    await ensureExpanded();
    document.getElementById('addForm').classList.toggle('open');
  });
  document.getElementById('saveTool').addEventListener('click', async () => {
    const name = document.getElementById('fName').value.trim();
    const target = document.getElementById('fTarget').value.trim();
    if (!name || !target) return;
    tools = await window.sideDock.addTool({
      name, target,
      icon: document.getElementById('fIcon').value.trim() || '◆',
      kind: document.getElementById('fKind').value
    });
    document.getElementById('addForm').classList.remove('open');
    document.getElementById('fName').value = ''; document.getElementById('fTarget').value = ''; document.getElementById('fIcon').value = '';
    render();
  });

  const dockEl = document.querySelector('.dock');
  let hidden = false;
  let hideTimer = null;
  function setHiddenState(next) {
    if (hidden === next) return;
    hidden = next;
    if (hidden) {
      document.body.classList.add('hidden');
    } else {
      // Show slide: pehle arrow-only hatao, reflow, phir next frame par hidden hatao, taake transform 120% -> 0 animate ho.
      // Agar hidden turant hata diya jaye jab dock display:none hai, to slide kabhi paint nahi hota, achanak aa jata hai.
      document.body.classList.remove('arrow-only');
      void document.querySelector('.dock').offsetWidth;
      requestAnimationFrame(() => { document.body.classList.remove('hidden'); });
    }
    window.sideDock.setHidden(hidden);
    if (!hidden) window.sideDock.setMouseEvents(false);
  }
  // Arrow window se show hone par renderer ka hidden flag bhi sync karo,
  // warna window wapas aa jayegi par dock chhupa hi rahega.
  if (window.sideDock.onAutoHideHide) {
    window.sideDock.onAutoHideHide(() => {
      cancelHide();
      hidden = true;
      document.body.classList.add('hidden');
      // Slide khatam hone ke baad dock ko layout se hatao, taake arrow grid me bilkul center me aaye, neeche ya upar nahi.
      setTimeout(() => { if (hidden) document.body.classList.add('arrow-only'); }, 200);
    });
  }
  if (window.sideDock.onAutoHideShow) {
    window.sideDock.onAutoHideShow(() => {
      cancelHide();
      lastShowAt = Date.now();
      if (!hidden) return; // setHiddenState ne staged slide already kar diya hai, dobara mat karo.
      hidden = false;
      document.body.classList.remove('arrow-only');
      void document.querySelector('.dock').offsetWidth;
      requestAnimationFrame(() => { document.body.classList.remove('hidden'); });
      window.sideDock.setMouseEvents(false);
    });
  }
  let lastShowAt = 0;
  function scheduleHide() {
    if (!autoHide) return;
    if (Date.now() - lastShowAt < 300) return;
    if (hideTimer) clearTimeout(hideTimer);
    hideTimer = setTimeout(() => setHiddenState(true), 800);
  }
  function cancelHide() {
    if (hideTimer) { clearTimeout(hideTimer); hideTimer = null; }
  }
  dockEl.addEventListener('mouseenter', () => { cancelHide(); window.sideDock.setMouseEvents(false); });
  dockEl.addEventListener('mouseleave', () => {
    if (mode === 'collapsed') window.sideDock.setMouseEvents(true);
    // Hide sirf main poller se hoga, DOM mouseleave se nahi, taake race na ho.
  });
  window.sideDock.getState().then(state => { mode = state.mode; autoStart = state.autoStart !== false; theme = (state.theme === 'light' || state.theme === 'glass') ? state.theme : 'dark'; autoHide = state.autoHide === true; document.getElementById('autohideBtn').textContent = autoHide ? 'On' : 'Off'; tools = state.tools || []; document.getElementById('autoBtn').textContent = autoStart ? 'On' : 'Off'; applyTheme(); render(); if (mode === 'collapsed') window.sideDock.setMouseEvents(true); });
</script>
</body>
</html>
