<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Side Dock</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  :root {
    --bg: #0a0a0f; --panel: rgba(0,0,0,.45); --panel2: rgba(0,0,0,.55); --line: rgba(255,255,255,.25);
    --text: #111827; --muted: #4b5563; --green: #2fe07a; --cyan: #ffffff;
  }
  html, body { height: 100%; }
  body {
    background: transparent; color: var(--text);
    font-family: Inter, Segoe UI, system-ui, sans-serif;
    overflow: hidden; user-select: none;
    display: flex; justify-content: flex-end;
  }
  .dock {
    position: relative; height: 100%; width: 100%; display: flex; flex-direction: column;
    transition: width .18s ease;
    overflow: hidden;
  }
  .liquidGlass-wrapper {
    position: relative; display: flex; font-weight: 600; overflow: hidden;
    box-shadow: 0 6px 6px rgba(0,0,0,.20), 0 0 20px rgba(0,0,0,.10);
    transition: all .4s cubic-bezier(.175,.885,.32,2.2);
  }
  .liquidGlass-effect {
    position: absolute; z-index: 0; inset: 0;
    backdrop-filter: blur(3px); -webkit-backdrop-filter: blur(3px);
    filter: url(#glass-distortion); overflow: hidden;
  }
  .liquidGlass-tint {
    z-index: 1; position: absolute; inset: 0;
    background: rgba(255,255,255,.50);
  }
  .liquidGlass-shine {
    position: absolute; inset: 0; z-index: 2; overflow: hidden;
    box-shadow: inset 2px 2px 1px 0 rgba(255,255,255,.50), inset -1px -1px 1px 1px rgba(255,255,255,.50);
  }
  .liquidGlass-text {
    z-index: 3; width: 100%; height: 100%; padding: 14px 10px;
    display: flex; flex-direction: column; gap: 14px; align-items: stretch;
    color: black;
  }
  body.collapsed .liquidGlass-text { padding: 12px 10px; align-items: center; }
  body.collapsed .liquidGlass-text .topbar, body.collapsed .liquidGlass-text .tool-list, body.collapsed .liquidGlass-text .footer { align-items: center; }
  .dock, .dock > div { border-radius: 2rem; }
  .liquidGlass-text .topbar, .liquidGlass-text .tool-list, .liquidGlass-text .footer, .liquidGlass-text .form { border-radius: 0; }
  body.collapsed .dock { width: 52px; padding: 0; align-items: center; }
  .topbar { display: flex; align-items: center; justify-content: space-between; -webkit-app-region: drag; }
  .brand { display: flex; align-items: center; gap: 10px; min-width: 0; }
  .logo {
    width: 30px; height: 30px; flex: 0 0 30px; border-radius: 9px;
    background: transparent; border: 1px solid rgba(255,255,255,.45);
    -webkit-backdrop-filter: blur(14px); backdrop-filter: blur(14px);
    box-shadow: 0 4px 16px rgba(0,0,0,.12), inset 0 1px 0 rgba(255,255,255,.35), inset 0 -1px 0 rgba(255,255,255,.08);
    display: grid; place-items: center; font-size: 16px; color: #111827;
  }
  .brand-name { font-weight: 800; font-size: 18px; white-space: nowrap; line-height: 30px; }
  .brand-sub { font-size: 11px; color: var(--muted); white-space: nowrap; }
  .top-actions { display: flex; gap: 6px; -webkit-app-region: no-drag; }
  .winbtns { display: flex; gap: 6px; }
  .winbtns button, .settings-btn {
    width: 30px; height: 30px; border-radius: 9px; border: 1px solid rgba(255,255,255,.45);
    background: transparent; color: var(--muted); cursor: pointer; font-size: 14px;
    -webkit-backdrop-filter: blur(14px); backdrop-filter: blur(14px);
    box-shadow: 0 4px 16px rgba(0,0,0,.12), inset 0 1px 0 rgba(255,255,255,.35), inset 0 -1px 0 rgba(255,255,255,.08);
  }
  .winbtns button:hover, .settings-btn:hover { color: var(--text); }
  .tool-list { flex: 1; display: flex; flex-direction: column; gap: 8px; overflow-y: auto; padding: 2px; }
  .tool {
    display: flex; align-items: center; gap: 12px; width: 100%; text-align: left;
    background: transparent; border: 1px solid transparent; border-radius: 14px;
    color: var(--text); padding: 9px 10px; cursor: pointer; position: relative;
  }
  .tool:hover { background: rgba(255,255,255,.10); border-color: rgba(255,255,255,.22); }
  .tool .icon {
    width: 44px; height: 44px; flex: 0 0 44px; border-radius: 13px; display: grid; place-items: center;
    background: transparent; border: 1px solid rgba(255,255,255,.45); font-size: 20px;
    box-shadow: 0 4px 16px rgba(0,0,0,.12), inset 0 1px 0 rgba(255,255,255,.35), inset 0 -1px 0 rgba(255,255,255,.08);
  }
  .tool .name { font-size: 14px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; flex: 1; }
  .tool .del { display: none; border: 0; background: transparent; color: var(--muted); cursor: pointer; font-size: 16px; }
  .tool:hover .del { display: block; }
  .footer { display: flex; flex-direction: column; gap: 8px; width: 100%; }
  .btn {
    display: flex; align-items: center; gap: 10px; width: 100%; min-height: 32px; padding: 6px 12px;
    border-radius: 10px; border: 1px solid rgba(255,255,255,.28); background: transparent;
    -webkit-backdrop-filter: blur(14px); backdrop-filter: blur(14px);
    box-shadow: 0 4px 16px rgba(0,0,0,.12), inset 0 1px 0 rgba(255,255,255,.35), inset 0 -1px 0 rgba(255,255,255,.08);
    color: var(--text); cursor: pointer; font-size: 13px; font-weight: 600;
  }
  .btn.primary { background: transparent; border-color: rgba(255,255,255,.50); color: #111827; box-shadow: 0 4px 16px rgba(0,0,0,.12), inset 0 1px 0 rgba(255,255,255,.35), inset 0 -1px 0 rgba(255,255,255,.08); }
  .btn span.ic { font-size: 17px; flex: 0 0 auto; }
  .form { display: none; background: transparent; border: 1px solid rgba(255,255,255,.30); border-radius: 16px; padding: 12px; gap: 8px; flex-direction: column; -webkit-backdrop-filter: blur(12px); backdrop-filter: blur(12px); }
  .form.open { display: flex; }
  .form input, .form select {
    width: 100%; padding: 10px; border-radius: 10px; border: 1px solid var(--line);
    background: transparent; color: var(--text); outline: none; font-size: 13px;
  }
  .form label { font-size: 11px; color: var(--muted); }
  .update-status { font-size: 12px; color: var(--muted); line-height: 1.5; padding: 0 4px; min-height: 18px; }
  .settings-row { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
  .settings-row label { font-size: 13px; color: var(--text); }
  .toggle { min-width: 52px; padding: 8px 10px; border-radius: 999px; border: 1px solid rgba(255,255,255,.50); background: linear-gradient(135deg, rgba(215,222,232,.60), rgba(195,205,220,.40)); -webkit-backdrop-filter: blur(12px); backdrop-filter: blur(12px); box-shadow: 0 4px 16px rgba(0,0,0,.12), inset 0 1px 0 rgba(255,255,255,.35), inset 0 -1px 0 rgba(255,255,255,.08); color: var(--text); cursor: pointer; font-size: 12px; font-weight: 700; }
  /* Collapsed: icons only, but every button stays visible as an icon. */
  body.collapsed .brand-name, body.collapsed .brand-sub,
  body.collapsed .tool .name, body.collapsed .tool .del, body.collapsed .collapse-label,
  body.collapsed .winbtns, body.collapsed .add-label { display: none !important; }
  body.collapsed .topbar { flex-direction: column; gap: 8px; width: 30px; justify-content: flex-start; align-items: center; }
  body.collapsed .brand { width: 30px; justify-content: center; gap: 0; }
  body.collapsed .brand > div:not(.logo) { display: none; }
  body.collapsed .top-actions { width: 30px; justify-content: center; }
  body.collapsed .tool-list { width: 30px; flex: 1; align-items: center; }
  body.collapsed .tool { width: 30px; height: 30px; padding: 0; justify-content: center; position: relative; }
  body.collapsed .tool .icon { width: 30px; height: 30px; flex: 0 0 30px; border-radius: 9px; font-size: 15px; }
  body.collapsed .logo { width: 30px; height: 30px; flex: 0 0 30px; border-radius: 9px; font-size: 16px; }
  body.collapsed .btn { position: relative; width: 30px; height: 30px; min-height: 30px; padding: 0; justify-content: center; border-radius: 9px; }
  body.collapsed .btn span.ic { font-size: 15px; }
  body.collapsed .settings-btn { position: relative; width: 30px; height: 30px; border-radius: 9px; font-size: 14px; }
  body.collapsed .tool:hover::after,
  body.collapsed .btn:hover::after,
  body.collapsed .settings-btn:hover::after {
    content: attr(data-tip); position: absolute; right: calc(100% + 10px); top: 50%; transform: translateY(-50%); z-index: 50;
    background: transparent; -webkit-backdrop-filter: blur(12px); backdrop-filter: blur(12px); border: 1px solid rgba(255,255,255,.20); color: var(--text);
    padding: 8px 12px; border-radius: 11px; font-size: 13px; white-space: nowrap;
    box-shadow: 0 10px 30px rgba(0,0,0,.45);
  }
  body.collapsed .tool:hover::after { content: attr(data-name); }
  body.collapsed .footer { width: 30px; }
  body.collapsed .form { display: none !important; }
</style>
</head>
<body>
<div class="dock liquidGlass-wrapper">
  <div class="liquidGlass-effect"></div>
  <div class="liquidGlass-tint"></div>
  <div class="liquidGlass-shine"></div>
  <div class="liquidGlass-text">
  <div class="topbar">
    <div class="brand">
      <div class="logo">⚡</div>
      <div class="brand-name">Side Dock</div>
    </div>
    <div class="top-actions">
      <button class="settings-btn" id="settingsBtn" title="Settings" data-tip="Settings">⚙</button>
      <div class="winbtns">
        <button id="minBtn" title="Minimize">–</button>
        <button id="closeBtn" title="Close">✕</button>
      </div>
    </div>
  </div>

  <div class="form" id="settingsPanel">
    <button class="btn primary" id="updateBtn"><span class="ic">⟳</span><span>Update</span></button>
    <div class="update-status" id="updateStatus"></div>
    <div class="settings-row">
      <label>Auto-start</label>
      <button class="toggle" id="autoBtn">On</button>
    </div>
  </div>

  <div class="tool-list" id="toolList"></div>

  <div class="form" id="addForm">
    <label>Tool name</label><input id="fName" placeholder="e.g. Notion">
    <label>Icon (emoji or letter)</label><input id="fIcon" placeholder="e.g. 📝" maxlength="4">
    <label>Type</label>
    <select id="fKind"><option value="url">Website / link</option><option value="app">Laptop app / command</option></select>
    <label>Link or app path / command</label><input id="fTarget" placeholder="https://... or C:\... or app name">
    <button class="btn primary" id="saveTool"><span class="ic">✓</span><span>Save tool</span></button>
  </div>

  <div class="footer">
    <button class="btn" id="addBtn" data-tip="Add tool"><span class="ic">＋</span><span class="add-label">Add tool</span></button>
    <button class="btn" id="collapseBtn" data-tip="Expand Sidebar"><span class="ic">◀</span><span class="collapse-label">Collapse Sidebar</span></button>
  </div>
  </div>
</div>
<svg style="display: none">
  <filter id="glass-distortion" x="0%" y="0%" width="100%" height="100%" filterUnits="objectBoundingBox">
    <feTurbulence type="fractalNoise" baseFrequency="0.01 0.01" numOctaves="1" seed="5" result="turbulence" />
    <feComponentTransfer in="turbulence" result="mapped">
      <feFuncR type="gamma" amplitude="1" exponent="10" offset="0.5" />
      <feFuncG type="gamma" amplitude="0" exponent="1" offset="0" />
      <feFuncB type="gamma" amplitude="0" exponent="1" offset="0.5" />
    </feComponentTransfer>
    <feGaussianBlur in="turbulence" stdDeviation="3" result="softMap" />
    <feSpecularLighting in="softMap" surfaceScale="5" specularConstant="1" specularExponent="100" lighting-color="white" result="specLight">
      <fePointLight x="-200" y="-200" z="300" />
    </feSpecularLighting>
    <feComposite in="specLight" operator="arithmetic" k1="0" k2="1" k3="1" k4="0" result="litImage" />
    <feDisplacementMap in="SourceGraphic" in2="softMap" scale="150" xChannelSelector="R" yChannelSelector="G" />
  </filter>
</svg>

<script>
  let mode = 'expanded';
  let autoStart = true;
  let tools = [];
  const list = document.getElementById('toolList');

  function render() {
    document.body.classList.toggle('collapsed', mode === 'collapsed');
    document.querySelector('#collapseBtn .ic').textContent = mode === 'collapsed' ? '▶' : '◀';
    document.querySelector('#collapseBtn .collapse-label').textContent = mode === 'collapsed' ? 'Expand Sidebar' : 'Collapse Sidebar';
    document.getElementById('collapseBtn').dataset.tip = mode === 'collapsed' ? 'Expand Sidebar' : 'Collapse Sidebar';
    list.querySelectorAll('.tool').forEach(el => el.remove());
    tools.forEach(tool => {
      const b = document.createElement('button');
      b.className = 'tool'; b.dataset.name = tool.name;
      b.innerHTML = `<span class="icon">${tool.icon || '◆'}</span><span class="name">${tool.name}</span><span class="del" title="Remove">✕</span>`;
      b.addEventListener('click', (e) => {
        if (e.target.classList.contains('del')) return;
        window.sideDock.launchTool(tool);
      });
      b.querySelector('.del').addEventListener('click', async () => {
        tools = await window.sideDock.removeTool(tool.id); render();
      });
      list.appendChild(b);
    });
  }

  async function ensureExpanded() {
    if (mode === 'collapsed') {
      mode = await window.sideDock.setMode('expanded');
      render();
    }
  }

  document.getElementById('autoBtn').addEventListener('click', async () => {
    autoStart = await window.sideDock.setAutostart(!autoStart);
    document.getElementById('autoBtn').textContent = autoStart ? 'On' : 'Off';
  });
  document.getElementById('settingsBtn').addEventListener('click', async () => {
    await ensureExpanded();
    document.getElementById('settingsPanel').classList.toggle('open');
    document.getElementById('updateStatus').textContent = '';
  });
  document.getElementById('updateBtn').addEventListener('click', async () => {
    const status = document.getElementById('updateStatus');
    status.textContent = 'Checking for update, please wait...';
    const result = await window.sideDock.doUpdate();
    status.textContent = result.message || '';
  });
  document.getElementById('collapseBtn').addEventListener('click', async () => {
    mode = await window.sideDock.setMode(mode === 'collapsed' ? 'expanded' : 'collapsed');
    render();
  });
  document.getElementById('addBtn').addEventListener('click', async () => {
    await ensureExpanded();
    document.getElementById('addForm').classList.toggle('open');
  });
  document.getElementById('saveTool').addEventListener('click', async () => {
    const name = document.getElementById('fName').value.trim();
    const target = document.getElementById('fTarget').value.trim();
    if (!name || !target) return;
    tools = await window.sideDock.addTool({
      name, target,
      icon: document.getElementById('fIcon').value.trim() || '◆',
      kind: document.getElementById('fKind').value
    });
    document.getElementById('addForm').classList.remove('open');
    document.getElementById('fName').value = ''; document.getElementById('fTarget').value = ''; document.getElementById('fIcon').value = '';
    render();
  });
  document.getElementById('minBtn').addEventListener('click', () => window.sideDock.minimize());
  document.getElementById('closeBtn').addEventListener('click', () => window.sideDock.close());

  const dockEl = document.querySelector('.dock');
  dockEl.addEventListener('mouseenter', () => window.sideDock.setMouseEvents(false));
  dockEl.addEventListener('mouseleave', () => window.sideDock.setMouseEvents(true));
  window.sideDock.getState().then(state => { mode = state.mode; autoStart = state.autoStart !== false; tools = state.tools || []; document.getElementById('autoBtn').textContent = autoStart ? 'On' : 'Off'; render(); if (mode === 'collapsed') window.sideDock.setMouseEvents(true); });
</script>
</body>
</html>
