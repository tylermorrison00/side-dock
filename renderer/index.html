<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Side Dock</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  :root {
    --bg: rgba(26, 18, 16, 0.85); --panel: rgba(36, 26, 21, 0.85); --panel2: rgba(46, 33, 26, 0.85); --line: #3a2a22;
    --text: #f5e9dc; --muted: #a89888; --green: #2fe07a; --cyan: #ff7a1a;
    --accent: #ff7a1a;
  }
  body.light {
    --bg: rgba(243, 230, 211, 0.85); --panel: rgba(251, 243, 228, 0.85); --panel2: rgba(239, 224, 200, 0.85); --line: #e0cdb0;
    --text: #1f1a17; --muted: #8a7a6a; --green: #2fe07a; --cyan: #ff7a1a;
    --accent: #ff7a1a;
  }
  body.light .dock { border-color: #e0cdb0; box-shadow: 0 20px 50px rgba(120,90,50,.25), 0 0 0 1px rgba(255,255,255,.50); }
  body.light .logo { background: var(--bg); }
  body.light .tool .icon { background: #fbf3e4; }
  body.light .btn.primary { background: #ff7a1a; border-color: #ff7a1a; color: #ffffff; }
  html, body { height: 100%; }
  body {
    background: transparent; color: var(--text);
    font-family: Inter, Segoe UI, system-ui, sans-serif;
    overflow: hidden; user-select: none;
    display: flex; justify-content: flex-end; gap: 8px;
  }
  .dock, .settings-panel, #toolView { overflow-x: hidden; max-width: 100%; box-sizing: border-box; }
  .dock * { max-width: 100%; }
  #rail { width: 56px; height: 100%; flex: 0 0 56px; padding: 14px 8px; display: flex; flex-direction: column; align-items: center; gap: 12px; background: var(--bg); border: 1px solid var(--line); border-radius: 18px; box-shadow: 0 20px 50px rgba(0,0,0,.60); }
  #rail .logo { width: 32px; height: 32px; flex: 0 0 32px; }
  #railTools { display: flex; flex-direction: column; align-items: center; gap: 12px; flex: 1; overflow-y: auto; width: 100%; }
  #railTools .tool { width: 32px; height: 32px; padding: 0; justify-content: center; }
  #railTools .tool .icon { width: 32px; height: 32px; flex: 0 0 32px; border-radius: 10px; font-size: 16px; }
  #railTools .tool .name, #railTools .tool .del { display: none !important; }
  #rail .settings-btn { width: 32px; height: 32px; border-radius: 10px; font-size: 15px; }
  #rail .tool:hover::after, #rail .settings-btn:hover::after { content: attr(data-name); position: absolute; right: calc(100% + 10px); top: 50%; transform: translateY(-50%); z-index: 50; background: var(--panel); border: 1px solid var(--line); color: var(--text); padding: 8px 12px; border-radius: 11px; font-size: 13px; white-space: nowrap; box-shadow: 0 10px 30px rgba(0,0,0,.45); }
  #rail .settings-btn:hover::after { content: attr(data-tip); }
  body:not(.panel-open) .dock { display: none !important; }
  body.panel-open .dock { display: flex !important; width: 300px; flex: 0 0 300px; }
  body.hidden #rail { opacity: 0; pointer-events: none; transform: translateX(120%); transition: transform .30s ease, opacity .30s ease; }
  body.arrow-only #rail { display: none !important; }
  .dock {
    height: 100%; width: 100%; padding: 14px 10px; display: flex; flex-direction: column; gap: 14px;
    background: var(--bg); border: 1px solid var(--line); border-radius: 24px 24px 24px 24px;
    box-shadow: 0 20px 50px rgba(0,0,0,.60);
    transition: transform .30s ease, opacity .30s ease;
  }
  body.hidden .dock { transform: translateX(120%); opacity: 0; pointer-events: none; width: 300px; flex: 0 0 300px; }
  body.hidden.collapsed .dock { width: 56px; flex: 0 0 56px; }
  body.collapsed .dock { width: 56px; padding: 14px 8px; align-items: center; border-radius: 18px 18px 18px 18px; }
  .topbar { display: flex; align-items: center; justify-content: space-between; -webkit-app-region: drag; }
  .brand { display: flex; align-items: center; gap: 10px; min-width: 0; flex-shrink: 1; }
  .logo {
    width: 30px; height: 30px; flex: 0 0 30px; border-radius: 9px; overflow: hidden;
    background: var(--bg); border: 1px solid var(--line);
    display: grid; place-items: center; font-size: 16px; color: var(--cyan); padding: 0;
  }
  .logo img { width: 100%; height: 100%; object-fit: cover; display: block; border-radius: 9px; }
  .brand-name { font-weight: 800; font-size: 18px; white-space: nowrap; line-height: 30px; }
  .brand-sub { font-size: 11px; color: var(--muted); white-space: nowrap; }
  .top-actions { display: flex; gap: 6px; -webkit-app-region: no-drag; flex-shrink: 0; }
  .winbtns { display: flex; gap: 6px; }
  .winbtns button, .settings-btn {
    width: 30px; height: 30px; border-radius: 9px; border: 1px solid var(--line);
    background: var(--panel); color: var(--muted); cursor: pointer; font-size: 14px;
  }
  .winbtns button:hover, .settings-btn:hover { color: var(--text); }
  .tool-list { flex: 1; display: flex; flex-direction: column; gap: 8px; overflow-y: auto; overflow-x: hidden; padding: 2px; }
  .tool {
    display: flex; align-items: center; gap: 12px; width: 100%; text-align: left;
    background: transparent; border: 1px solid transparent; border-radius: 14px;
    color: var(--text); padding: 9px 10px; cursor: pointer; position: relative;
  }
  .tool:hover { background: var(--panel2); border-color: var(--line); }
  .tool .icon {
    width: 44px; height: 44px; flex: 0 0 44px; border-radius: 13px; display: grid; place-items: center;
    background: var(--panel2); border: 1px solid var(--line); font-size: 20px;
  }
  .tool .name { font-size: 14px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; flex: 1; }
  .tool .del { display: none; border: 0; background: transparent; color: var(--muted); cursor: pointer; font-size: 16px; }
  .tool:hover .del { display: block; }
  .footer { display: flex; flex-direction: column; gap: 8px; width: 100%; }
  .btn {
    display: flex; align-items: center; gap: 10px; width: 100%; min-height: 32px; padding: 6px 12px;
    border-radius: 10px; border: 1px solid var(--line); background: var(--panel);
    color: var(--text); cursor: pointer; font-size: 13px; font-weight: 600;
  }
  .btn.primary { background: #ff7a1a; border-color: #ff7a1a; color: #ffffff; }
  .btn span.ic { font-size: 17px; flex: 0 0 auto; display: grid; place-items: center; }
  .btn span.ic svg { display: block; }
  .form { display: none; background: var(--panel); border: 1px solid var(--line); border-radius: 16px; padding: 12px; gap: 8px; flex-direction: column; }
  .form.open { display: flex; }
  .form input, .form select {
    width: 100%; padding: 10px; border-radius: 10px; border: 1px solid var(--line);
    background: var(--panel2); color: var(--text); outline: none; font-size: 13px;
  }
  .form label { font-size: 11px; color: var(--muted); }
  .update-status { font-size: 12px; color: var(--muted); line-height: 1.5; padding: 0 4px; min-height: 18px; }
  .settings-row { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
  .settings-row label { font-size: 13px; color: var(--text); }
  .toggle { min-width: 52px; padding: 8px 10px; border-radius: 999px; border: 1px solid var(--line); background: var(--panel2); color: var(--text); cursor: pointer; font-size: 12px; font-weight: 700; }
  /* Collapsed: icons only, but every button stays visible as an icon. */
  body.collapsed .brand-name, body.collapsed .brand-sub,
  body.collapsed .tool .name, body.collapsed .tool .del, body.collapsed .collapse-label,
  body.collapsed .winbtns, body.collapsed .add-label { display: none !important; }
  body.collapsed .topbar { flex-direction: column; gap: 10px; width: 32px; justify-content: flex-start; align-items: center; }
  body.collapsed .brand { width: 32px; justify-content: center; gap: 0; }
  body.collapsed .brand > div:not(.logo) { display: none; }
  body.collapsed .top-actions { width: 32px; justify-content: center; }
  body.collapsed .tool-list { width: 32px; flex: 1; align-items: center; gap: 12px; }
  body.collapsed .tool { width: 32px; height: 32px; padding: 0; justify-content: center; position: relative; }
  body.collapsed .tool .icon { width: 32px; height: 32px; flex: 0 0 32px; border-radius: 10px; font-size: 16px; }
  body.collapsed .logo { width: 32px; height: 32px; flex: 0 0 32px; border-radius: 10px; font-size: 16px; }
  body.collapsed .btn { position: relative; width: 32px; height: 32px; min-height: 32px; padding: 0; justify-content: center; border-radius: 10px; }
  body.collapsed .btn span.ic { font-size: 16px; }
  body.collapsed .settings-btn { position: relative; width: 32px; height: 32px; border-radius: 10px; font-size: 15px; }
  body.collapsed .tool:hover::after,
  body.collapsed .btn:hover::after,
  body.collapsed .settings-btn:hover::after {
    content: attr(data-tip); position: absolute; right: calc(100% + 10px); top: 50%; transform: translateY(-50%); z-index: 50;
    background: var(--panel); border: 1px solid var(--line); color: var(--text);
    padding: 8px 12px; border-radius: 11px; font-size: 13px; white-space: nowrap;
    box-shadow: 0 10px 30px rgba(0,0,0,.45);
  }
  body.collapsed .tool:hover::after { content: attr(data-name); }
  body.collapsed .footer { width: 32px; gap: 12px; align-items: center; justify-content: center; margin-left: auto; margin-right: auto; }
  body.collapsed .form { display: none !important; }
  #arrowTab { display: none; width: 24px; height: 64px; background: var(--bg); border: 1px solid var(--line); border-right: 0; border-radius: 12px 0 0 12px; color: var(--accent); font-size: 16px; font-weight: 800; align-items: center; justify-content: center; cursor: pointer; position: absolute; left: 0; top: 50%; transform: translateY(-50%); }
  body.hidden { display: flex; justify-content: flex-end; }
  body.hidden #arrowTab { display: none; }
  body.hidden.arrow-only #arrowTab { display: grid; position: absolute; left: 0; top: 50%; transform: translateY(-50%); }
  body.arrow-only .dock { display: none !important; }
  body.arrow-only #arrowTab { display: grid; position: absolute; left: 0; top: 50%; transform: translateY(-50%); }
  /* Auto-hide: hidden hone par dock chhupa rehta hai, arrow alag chhoti window me dikhta hai,
     taake main window click-through ho aur peeche wali window ke button block na hon. */
  /* body.hidden dock slide handled above */
</style>
</head>
<body>
<div id="arrowTab">◀</div>
<div class="dock">
  <div class="topbar">
    <div class="brand">
      <div class="logo"><img id="logoImg" src="../assets/icon-orange-dark.png" alt="Side Dock" onerror="this.src='../assets/icon-orange-transparent.png'; this.onerror=function(){this.src='../assets/icon.png'; this.onerror=function(){this.style.display='none'; this.parentElement.textContent='⚡';};};"></div>
      <div class="brand-name">Side Dock</div>
    </div>
    <div class="top-actions">
      <button class="settings-btn" id="closePanelBtn" title="Close panel">✕</button>
    </div>
  </div>

  <div class="form" id="settingsPanel">
    <button class="btn primary" id="updateBtn"><span class="ic">⟳</span><span>Update</span></button>
    <div class="update-status" id="updateStatus"></div>
    <div class="settings-row">
      <label>Auto-start</label>
      <button class="toggle" id="autoBtn">On</button>
    </div>
    <div class="settings-row">
      <label>Theme</label>
      <button class="toggle" id="themeBtn">Dark</button>
    </div>
    <div class="settings-row">
      <label>Auto-hide</label>
      <button class="toggle" id="autohideBtn">Off</button>
    </div>
  </div>

  <div id="toolView" style="display:none; flex-direction:column; gap:12px; flex:1; overflow-y:auto; overflow-x:hidden; max-width:100%;">
    <div class="add" style="display:flex; gap:8px;">
      <input id="panelTodoInput" placeholder="Add a new task..." style="flex:1; min-width:0; box-sizing:border-box; padding:10px 12px; border-radius:10px; border:1px solid var(--line); background:var(--panel2); color:var(--text); outline:none; font-size:14px;">
      <button class="btn primary" id="panelAddBtn" style="width:auto; padding:10px 16px;">Add</button>
    </div>
    <div id="panelTodoList" style="display:flex; flex-direction:column; gap:8px;"></div>
    <div id="panelNotesUI" style="display:none; flex-direction:column; gap:12px;">
      <textarea id="panelNoteInput" placeholder="Write a note..." style="width:100%; min-height:100px; box-sizing:border-box; padding:10px 12px; border-radius:10px; border:1px solid var(--line); background:var(--panel2); color:var(--text); outline:none; font-size:14px; font-family:inherit; resize:vertical;"></textarea>
      <button class="btn primary" id="panelAddNoteBtn" style="width:auto; padding:10px 16px; align-self:flex-start;">Add note</button>
      <div id="panelNotesList" style="display:flex; flex-direction:column; gap:8px;"></div>
    </div>
    <div id="panelToolOpen" style="display:none; flex-direction:column; gap:12px;">
      <div id="panelToolDesc" style="font-size:13px; color:var(--muted); word-break:break-word;"></div>
      <button class="btn primary" id="panelOpenToolBtn"><span>Open</span></button>
    </div>
  </div>

  <div class="tool-list" id="toolList"></div>

  <div class="form" id="addForm">
    <label>Tool name</label><input id="fName" placeholder="e.g. Notion">
    <label>Icon (emoji or letter)</label><input id="fIcon" placeholder="e.g. 📝" maxlength="4">
    <label>Type</label>
    <select id="fKind"><option value="url">Website / link</option><option value="app">Laptop app / command</option></select>
    <label>Link or app path / command</label><input id="fTarget" placeholder="https://... or C:\... or app name">
    <button class="btn primary" id="saveTool"><span class="ic">✓</span><span>Save tool</span></button>
  </div>

</div>
<div id="rail">
  <div class="logo"><img id="railLogoImg" src="../assets/icon-orange-dark.png" alt="Side Dock" onerror="this.style.display='none';"></div>
  <div id="railTools"></div>
  <button class="settings-btn" id="railSettingsBtn" title="Settings" data-tip="Settings">⚙</button>
</div>

<script>
  let mode = 'collapsed';
  let panelOpen = false;
  let autoStart = true;
  let theme = 'dark';
  let autoHide = false;
  let tools = [];
  function applyTheme() {
    document.body.classList.toggle('light', theme === 'light');
    const tb = document.getElementById('themeBtn');
    if (tb) tb.textContent = theme === 'light' ? 'Light' : 'Dark';
    const li = document.getElementById('logoImg');
    if (li) li.src = theme === 'light' ? '../assets/icon-orange-light.png' : '../assets/icon-orange-dark.png';
    const tl = document.getElementById('toolLogoImg');
    if (tl && currentTool && currentTool.logo) tl.src = `../assets/${currentTool.logo}`;
    const rli = document.getElementById('railLogoImg');
    if (rli) rli.src = theme === 'light' ? '../assets/icon-orange-light.png' : '../assets/icon-orange-dark.png';
  }
  const list = document.getElementById('toolList');

  function render() {
    document.body.classList.toggle('panel-open', panelOpen);
    const railList = document.getElementById('railTools');
    railList.querySelectorAll('.tool').forEach(el => el.remove());
    list.querySelectorAll('.tool').forEach(el => el.remove());
    tools.forEach(tool => {
      const b = document.createElement('button');
      b.className = 'tool'; b.dataset.name = tool.name;
      b.innerHTML = `<span class="icon">${tool.icon || '◆'}</span><span class="name">${tool.name}</span>${tool.id === 'todo-list' ? '' : '<span class="del" title="Remove">✕</span>'}`;
      b.addEventListener('click', (e) => {
        if (e.target.classList.contains('del')) return;
        window.sideDock.launchTool(tool);
      });
      const delEl = b.querySelector('.del');
      if (delEl) delEl.addEventListener('click', async () => {
        tools = await window.sideDock.removeTool(tool.id); render();
      });
      list.appendChild(b);
      const rb = document.createElement('button');
      rb.className = 'tool'; rb.dataset.name = tool.name; rb.style.position = 'relative';
      rb.innerHTML = tool.logo ? `<img src="../assets/${tool.logo}" alt="${tool.name}" style="width:32px; height:32px; border-radius:8px; opacity:0.85; object-fit:contain;">` : `<span class="icon">${tool.icon || '◆'}</span>`;
      rb.addEventListener('click', async () => {
        if (panelOpen && currentTool && currentTool.id === tool.id) { await closePanel(); return; }
        await openPanel();
        showToolView(tool);
      });
      railList.appendChild(rb);
    });
    if (!currentTool) document.getElementById('settingsPanel').classList.toggle('open', panelOpen);
  }

  let currentTool = null;
  function showSettingsView() {
    currentTool = null;
    document.getElementById('settingsPanel').classList.add('open');
    document.getElementById('toolView').style.display = 'none';
    document.getElementById('toolList').style.display = 'none';
    document.querySelector('.brand-name').textContent = 'Side Dock';
    const logoEl = document.querySelector('.brand .logo');
    logoEl.innerHTML = '<img id="logoImg" src="../assets/icon-orange-dark.png" alt="Side Dock">';
    applyTheme();
  }
  function showToolView(tool) {
    currentTool = tool;
    document.getElementById('settingsPanel').classList.remove('open');
    document.getElementById('toolList').style.display = 'none';
    document.querySelector('.brand-name').textContent = tool.name;
    const logoEl = document.querySelector('.brand .logo');
    logoEl.innerHTML = tool.logo ? `<img id="toolLogoImg" src="../assets/${tool.logo}" alt="${tool.name}" style="width:30px; height:30px; border-radius:9px; opacity:0.85; object-fit:contain; display:block;">` : `<span style="font-size:20px; display:grid; place-items:center; width:100%; height:100%;">${tool.icon || '◆'}</span>`;
    const tv = document.getElementById('toolView');
    tv.style.display = 'flex';
    if (tool.id === 'todo-list' || tool.target === 'todo') {
      document.querySelector('#toolView .add').style.display = 'flex';
      document.getElementById('panelNotesUI').style.display = 'none';
      document.getElementById('panelToolOpen').style.display = 'none';
      renderPanelTodos();
    } else if (tool.id === 'notes' || tool.target === 'notes') {
      document.querySelector('#toolView .add').style.display = 'none';
      document.getElementById('panelTodoList').innerHTML = '';
      document.getElementById('panelToolOpen').style.display = 'none';
      document.getElementById('panelNotesUI').style.display = 'flex';
      renderPanelNotes();
    } else {
      document.querySelector('#toolView .add').style.display = 'none';
      document.getElementById('panelTodoList').innerHTML = '';
      document.getElementById('panelNotesUI').style.display = 'none';
      const po = document.getElementById('panelToolOpen');
      po.style.display = 'flex';
      document.getElementById('panelToolDesc').textContent = tool.target || '';
    }
  }
  async function renderPanelTodos() {
    const todos = await window.sideDock.getTodos();
    const listEl = document.getElementById('panelTodoList');
    listEl.innerHTML = '';
    if (!todos.length) { listEl.innerHTML = '<div style="text-align:center; color:var(--muted); padding:20px 10px; font-size:14px;">No tasks yet. Add your first task above.</div>'; return; }
    todos.forEach(todo => {
      const div = document.createElement('div');
      div.style.cssText = 'display:flex; align-items:center; gap:10px; padding:10px 12px; border-radius:10px; background:var(--panel); border:1px solid var(--line);';
      const cb = document.createElement('input'); cb.type = 'checkbox'; cb.checked = todo.done; cb.style.cssText = 'width:18px; height:18px; accent-color:#ff7a1a; cursor:pointer; flex-shrink:0;';
      cb.addEventListener('change', async () => { await window.sideDock.toggleTodo(todo.id); renderPanelTodos(); });
      const span = document.createElement('span'); span.textContent = todo.text; span.style.cssText = 'flex:1; font-size:14px; word-break:break-word;' + (todo.done ? ' text-decoration:line-through; opacity:0.5;' : '');
      const del = document.createElement('button'); del.textContent = '✕'; del.style.cssText = 'background:none; border:none; color:var(--muted); cursor:pointer; font-size:16px;';
      del.addEventListener('click', async () => { await window.sideDock.deleteTodo(todo.id); renderPanelTodos(); });
      div.append(cb, span, del); listEl.appendChild(div);
    });
  }
  async function renderPanelNotes() {
    const notes = await window.sideDock.getNotes();
    const listEl = document.getElementById('panelNotesList');
    listEl.innerHTML = '';
    if (!notes.length) { listEl.innerHTML = '<div style="text-align:center; color:var(--muted); padding:20px 10px; font-size:14px;">No notes yet. Write your first note above.</div>'; return; }
    notes.forEach(note => {
      const div = document.createElement('div');
      div.style.cssText = 'display:flex; align-items:flex-start; gap:10px; padding:10px 12px; border-radius:10px; background:var(--panel); border:1px solid var(--line);';
      const span = document.createElement('span'); span.textContent = note.text; span.style.cssText = 'flex:1; font-size:14px; word-break:break-word; white-space:pre-wrap;';
      const del = document.createElement('button'); del.textContent = '✕'; del.style.cssText = 'background:none; border:none; color:var(--muted); cursor:pointer; font-size:16px; flex-shrink:0;';
      del.addEventListener('click', async () => { await window.sideDock.deleteNote(note.id); renderPanelNotes(); });
      div.append(span, del); listEl.appendChild(div);
    });
  }
  document.getElementById('panelAddNoteBtn').addEventListener('click', async () => {
    const inp = document.getElementById('panelNoteInput');
    const text = inp.value.trim(); if (!text) return;
    await window.sideDock.addNote(text); inp.value = ''; renderPanelNotes();
  });
  document.getElementById('panelAddBtn').addEventListener('click', async () => {
    const inp = document.getElementById('panelTodoInput');
    const text = inp.value.trim(); if (!text) return;
    await window.sideDock.addTodo(text); inp.value = ''; renderPanelTodos();
  });
  document.getElementById('panelTodoInput').addEventListener('keydown', async (e) => {
    if (e.key === 'Enter') { const inp = e.target; const text = inp.value.trim(); if (!text) return; await window.sideDock.addTodo(text); inp.value = ''; renderPanelTodos(); }
  });
  document.getElementById('panelOpenToolBtn').addEventListener('click', () => { if (currentTool) window.sideDock.launchTool(currentTool); });

  async function openPanel() {
    if (!panelOpen) { panelOpen = await window.sideDock.setPanel(true); render(); }
  }
  async function closePanel() {
    panelOpen = await window.sideDock.setPanel(false); currentTool = null; render();
  }
  async function togglePanel() {
    panelOpen = await window.sideDock.setPanel(!panelOpen); render();
  }

  async function ensureExpanded() { await openPanel(); }

  document.getElementById('autoBtn').addEventListener('click', async () => {
    autoStart = await window.sideDock.setAutostart(!autoStart);
    document.getElementById('autoBtn').textContent = autoStart ? 'On' : 'Off';
  });
  document.getElementById('arrowTab').addEventListener('mouseenter', () => { cancelHide(); setHiddenState(false); });
  document.getElementById('arrowTab').addEventListener('click', () => { cancelHide(); setHiddenState(false); });
  document.getElementById('autohideBtn').addEventListener('click', async () => {
    autoHide = await window.sideDock.setAutohide(!autoHide);
    document.getElementById('arrowTab').addEventListener('mouseenter', () => { cancelHide(); setHiddenState(false); });
  document.getElementById('arrowTab').addEventListener('click', () => { cancelHide(); setHiddenState(false); });
  document.getElementById('autohideBtn').textContent = autoHide ? 'On' : 'Off';
  });
  document.getElementById('themeBtn').addEventListener('click', async () => {
    theme = await window.sideDock.setTheme(theme === 'light' ? 'dark' : 'light');
    applyTheme();
  });
  document.getElementById('closePanelBtn').addEventListener('click', async () => { await closePanel(); });
  document.getElementById('railSettingsBtn').addEventListener('click', async () => { if (panelOpen && !currentTool) { await closePanel(); } else { await openPanel(); showSettingsView(); } });
  document.getElementById('updateBtn').addEventListener('click', async () => {
    const status = document.getElementById('updateStatus');
    status.textContent = 'Checking for update, please wait...';
    const result = await window.sideDock.doUpdate();
    status.textContent = result.message || '';
  });
  if (document.getElementById('addBtn')) document.getElementById('addBtn').addEventListener('click', async () => {
    await openPanel();
    document.getElementById('addForm').classList.toggle('open');
  });
  document.getElementById('saveTool').addEventListener('click', async () => {
    const name = document.getElementById('fName').value.trim();
    const target = document.getElementById('fTarget').value.trim();
    if (!name || !target) return;
    tools = await window.sideDock.addTool({
      name, target,
      icon: document.getElementById('fIcon').value.trim() || '◆',
      kind: document.getElementById('fKind').value
    });
    document.getElementById('addForm').classList.remove('open');
    document.getElementById('fName').value = ''; document.getElementById('fTarget').value = ''; document.getElementById('fIcon').value = '';
    render();
  });

  const dockEl = document.querySelector('.dock');
  let hidden = false;
  let hideTimer = null;
  function setHiddenState(next) {
    if (hidden === next) return;
    hidden = next;
    if (hidden) {
      document.body.classList.add('hidden');
    } else {
      // Show slide: pehle arrow-only hatao, reflow, phir next frame par hidden hatao, taake transform 120% -> 0 animate ho.
      // Agar hidden turant hata diya jaye jab dock display:none hai, to slide kabhi paint nahi hota, achanak aa jata hai.
      document.body.classList.remove('arrow-only');
      void document.querySelector('.dock').offsetWidth;
      requestAnimationFrame(() => { document.body.classList.remove('hidden'); });
    }
    window.sideDock.setHidden(hidden);
    if (!hidden) window.sideDock.setMouseEvents(false);
  }
  // Arrow window se show hone par renderer ka hidden flag bhi sync karo,
  // warna window wapas aa jayegi par dock chhupa hi rahega.
  if (window.sideDock.onAutoHideHide) {
    window.sideDock.onAutoHideHide(() => {
      cancelHide();
      hidden = true;
      document.body.classList.add('hidden');
    });
  }
  if (window.sideDock.onAutoHideArrowOnly) {
    window.sideDock.onAutoHideArrowOnly(() => {
      document.body.classList.add('arrow-only');
    });
  }
  if (window.sideDock.onAutoHideShow) {
    window.sideDock.onAutoHideShow(() => {
      cancelHide();
      lastShowAt = Date.now();
      if (!hidden) return; // setHiddenState ne staged slide already kar diya hai, dobara mat karo.
      hidden = false;
      document.body.classList.remove('arrow-only');
      void document.querySelector('.dock').offsetWidth;
      requestAnimationFrame(() => { document.body.classList.remove('hidden'); });
      window.sideDock.setMouseEvents(false);
    });
  }
  let lastShowAt = 0;
  function scheduleHide() {
    if (!autoHide) return;
    if (Date.now() - lastShowAt < 300) return;
    if (hideTimer) clearTimeout(hideTimer);
    hideTimer = setTimeout(() => setHiddenState(true), 800);
  }
  function cancelHide() {
    if (hideTimer) { clearTimeout(hideTimer); hideTimer = null; }
  }
  dockEl.addEventListener('mouseenter', () => { cancelHide(); window.sideDock.setMouseEvents(false); });
  dockEl.addEventListener('mouseleave', () => {
    if (!panelOpen) window.sideDock.setMouseEvents(true);
  });
  const railEl = document.getElementById('rail');
  railEl.addEventListener('mouseenter', () => { cancelHide(); window.sideDock.setMouseEvents(false); });
  railEl.addEventListener('mouseleave', () => {
    if (!panelOpen) window.sideDock.setMouseEvents(true);
  });
  window.sideDock.getState().then(state => { mode = 'collapsed'; panelOpen = false; autoStart = state.autoStart !== false; theme = state.theme === 'light' ? 'light' : 'dark'; autoHide = state.autoHide === true; document.getElementById('autohideBtn').textContent = autoHide ? 'On' : 'Off'; tools = state.tools || []; document.getElementById('autoBtn').textContent = autoStart ? 'On' : 'Off'; applyTheme(); render(); window.sideDock.setMouseEvents(true); });
</script>
</body>
</html>
